name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", "package.json", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ACR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/acremote.jks"
            echo "ACR_KEYSTORE=$RUNNER_TEMP/acremote.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; the APK will be signed with a temporary debug key."
          fi

      - name: Build APK
        env:
          ACR_KEYSTORE_PASSWORD: ${{ secrets.ACR_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: AC-Remote-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
