<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AC Remote</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; color: #15171A;
         background: linear-gradient(180deg, #E3ECFA, #FFFFFF 60%); }
  .box { text-align: center; max-width: 380px; padding: 24px; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font-size: 20px; font-weight: 600; margin: 14px 0 6px; }
  p { color: #6B7079; margin: 0; }
  .spin { width: 22px; height: 22px; margin: 18px auto 0; border: 2.5px solid #D6E2F5; border-top-color: #4C8DF6; border-radius: 50%; animation: s 0.9s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation: none; } }
  code { background: #F2F3F5; padding: 2px 6px; border-radius: 6px; word-break: break-all; }
</style>
</head>
<body>
<div class="box">
  <img src="icon.png" alt="">
  <h1 id="t">Starting AC Remote</h1>
  <p id="m">Connecting to your air conditioner…</p>
  <div class="spin" id="s"></div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  if (q.get("error")) {
    document.getElementById("t").textContent = "AC Remote didn't start";
    document.getElementById("m").innerHTML = "Something stopped it from starting. Close it from the tray icon and open it again. If it keeps happening, the details are in <code></code>";
    document.querySelector("code").textContent = q.get("log") || "the log file";
    document.getElementById("s").remove();
  }
</script>
</body>
</html>
